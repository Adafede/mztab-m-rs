# Dependabot: Cargo dependencies (workspace and standalone crates), Python uv lockfile, and GitHub Actions digests.
# Renovate (renovate.json) handles tool pins in mk.versions / mk.local,
# the rust-toolchain.toml pin, and cargo-binstall. No ecosystem is covered twice.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/bindings/python"
      - "/bindings/r/src/rust"
      - "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # let a compromised release be caught before we take it
    commit-message:
      prefix: "chore(deps)" # Conventional Commits, required by ./mk commits
    ignore:
      # criterion >= 0.6 pulls `alloca`, whose C object crashes Apple clang 21 linking (D-073).
      - dependency-name: "criterion"
        versions: [">= 0.6"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # let a compromised release be caught before we take it
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # let a compromised release be caught before we take it
    commit-message:
      prefix: "chore(deps)"
