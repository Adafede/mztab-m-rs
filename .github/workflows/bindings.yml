name: Bindings

# Builds and tests the Python package (bindings/python, PyO3 + maturin) and
# the R package (bindings/r, extendr). They sit outside the Rust workspace
# because they need a Python interpreter and R headers (DECISIONS D-076).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # the tests read the spec's golden documents

      - name: Build the wheel
        working-directory: bindings/python
        run: |
          python3 -m venv ../../target/venv
          ../../target/venv/bin/pip install --quiet 'maturin==1.16.0'
          ../../target/venv/bin/maturin build --release --out ../../target/wheels

      - name: Install it and run the tests
        run: |
          target/venv/bin/pip install --quiet target/wheels/*.whl
          cd bindings/python
          ../../target/venv/bin/python -m unittest discover -s tests -v
          ../../target/venv/bin/python -c "import doctest, mztab_m, sys; sys.exit(doctest.testmod(mztab_m).failed)"

  r:
    name: R package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # the tests read the spec's golden documents

      - name: Install R and testthat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-dev r-cran-testthat

      - name: Install the package and run the tests
        run: |
          mkdir -p target/rlib
          R CMD INSTALL --no-docs --library=target/rlib bindings/r
          R_LIBS=target/rlib Rscript -e 'library(testthat); library(mztabm); test_dir("bindings/r/tests/testthat", stop_on_failure = TRUE)'
