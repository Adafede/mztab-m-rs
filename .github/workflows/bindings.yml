name: Bindings

# Builds and tests the Python package (bindings/python, PyO3 + maturin) and
# the R package (bindings/r, extendr). They sit outside the Rust workspace
# because they need a Python interpreter and R headers (DECISIONS D-076).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # the tests read the spec's golden documents

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: bindings/python

      - name: Build and test Python package
        run: ./mk bindings python

  r:
    name: R package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # the tests read the spec's golden documents

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: bindings/r/src/rust

      - name: Install R and testthat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-dev r-cran-testthat

      - name: Build and test R package
        run: ./mk bindings r
