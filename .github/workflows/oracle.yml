name: Oracle

# Runs the jmzTab-m validator (built from the pinned third_party/jmzTab-m
# submodule) over the pinned mzTab-M examples and the reader fixtures, and
# compares its output with tests/oracle/ (DECISIONS D-030, PLAN §6).
#
# The outputs are an artifact; to adopt them, download it, copy the files
# into crates/mztab-m/tests/oracle/, and commit. `cargo test --test oracle`
# then checks every disagreement against expected-disagreements.tsv.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/oracle.yml
      - crates/mztab-m/tests/oracle/**
      - third_party/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: jmzTab-m outputs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # pinned spec + jmzTab-m (third_party/)

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build the jmzTab-m CLI at the pinned commit
        working-directory: third_party/jmzTab-m
        run: ./mvnw -B -q -DskipTests -pl cli -am package

      - name: Run it over the corpus and the fixtures
        run: |
          set -euo pipefail
          jar="$(find third_party/jmzTab-m/cli/target -maxdepth 1 -name 'jmztabm-cli-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*' | head -n 1)"
          [ -n "$jar" ] || { echo "no CLI jar built" >&2; exit 1; }
          out=crates/mztab-m/tests/oracle
          mkdir -p "$out"
          while IFS= read -r file; do
            name="${file#third_party/mzTab-M/examples/}"
            name="${name#crates/mztab-m/tests/fixtures/}"
            # The CLI exits 1 when it reports warnings or errors: that is data.
            java -jar "$jar" -c "$file" -l Info > "$out/${name//\//__}.txt" 2>&1 || true
          done < <(find third_party/mzTab-M/examples crates/mztab-m/tests/fixtures \
            -type f \( -iname '*.mztab' \) | sort)

      - name: Upload the outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmztab-m-oracle
          path: crates/mztab-m/tests/oracle/*.txt
          if-no-files-found: error

      - name: Fail if the committed outputs are stale
        run: |
          if [ -n "$(git status --porcelain -- crates/mztab-m/tests/oracle/)" ]; then
            git status --short -- crates/mztab-m/tests/oracle/
            exit 1
          fi
