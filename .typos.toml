[files]
extend-exclude = [
  "*.svg",
  "Cargo.lock",
  "target/",
  # Upstream spec and reference implementation (pinned submodules), not ours to spell-check.
  "third_party/",
]

[default]
# Commit hashes (as in docs/agents/milestones.md) are not words.
extend-ignore-re = ["`[0-9a-f]{7,40}`"]

[default.extend-words]
# mzTab-M section codes and spec vocabulary.
SME = "SME"
SMF = "SMF"
SML = "SML"
SEH = "SEH"
SFH = "SFH"
SMH = "SMH"
masster = "masster"  # name of a metabolomics tool producing corpus files
