[package]
name = "mztab-m-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "Python bindings for mztab-m (the `mztab_m` package, built with maturin)."
license = "MIT OR Apache-2.0"
publish = false

# Built by maturin, outside the Rust workspace: it needs a Python
# interpreter, which the workspace gates do not (D-076).
[workspace]

[lib]
crate-type = ["cdylib"]
name = "_native"

[dependencies]
mztab-m = { path = "../../crates/mztab-m", features = ["json"] }
mztab-m-api = { path = "../../crates/mztab-m-api" }
mztab-m-obo = { path = "../../crates/mztab-m-obo" }
# The stable ABI (abi3) from Python 3.9: one wheel per platform for every
# Python version from 3.9 on.
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"] }

[build-dependencies]
pyo3-build-config = "0.30"

[lints.clippy]
all = { level = "warn", priority = -1 }
panic = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
