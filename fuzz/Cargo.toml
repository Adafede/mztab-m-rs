[package]
name = "mztab-m-fuzz"
version = "0.0.0"
edition = "2024"
description = "cargo-fuzz targets for mztab-m (nightly only, outside the workspace)."
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
bench = false
doc = false
name = "parse_bytes"
path = "fuzz_targets/parse_bytes.rs"
test = false

[[bin]]
bench = false
doc = false
name = "stream_vs_whole"
path = "fuzz_targets/stream_vs_whole.rs"
test = false

[[bin]]
bench = false
doc = false
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false

[[bin]]
bench = false
doc = false
name = "json"
path = "fuzz_targets/json.rs"
test = false

[[bin]]
bench = false
doc = false
name = "validate"
path = "fuzz_targets/validate.rs"
test = false

[[bin]]
bench = false
doc = false
name = "obo"
path = "fuzz_targets/obo.rs"
test = false

[dependencies]
libfuzzer-sys = "0.4"
mztab-m = { path = "../crates/mztab-m", features = ["json"] }
mztab-m-obo = { path = "../crates/mztab-m-obo" }

# Keep this crate out of the parent workspace.
[workspace]
